{{define "title"}}Log in · dside events{{end}}
{{define "content"}}
<h1>Log in</h1>
{{if .Error}}<p class="error" role="alert" id="email-err">{{.Error}}</p>{{end}}
<p>Enter your email and we'll send a six-digit code. No password.</p>
<form method="post" action="/login">
  <input type="hidden" name="next" value="{{.Next}}">
  <label for="email">Email</label>
  <input id="email" name="email" type="email" autocomplete="email" required value="{{.Email}}"{{if .Error}} aria-invalid="true" aria-describedby="email-err"{{end}}>
  <button>Send code</button>
</form>
{{end}}
